# Bridge that makes the local stack respond like Supabase:
#   /rest/v1/<table>  -> PostgREST /<table>   (drops the /rest/v1 prefix)
#   /auth/v1/<route>  -> GoTrue-compatible shim on the host (auth_shim.py)
server {
    listen 80;
    server_name _;

    client_max_body_size 20m;

    location /rest/v1/ {
        proxy_pass http://postgrest:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        # PostgREST runs every request as learn_anon (full grants); the
        # Supabase-style apikey/bearer headers are Supabase-specific.
        proxy_set_header Authorization "";
        proxy_set_header apikey "";
        proxy_read_timeout 60s;
    }

    location /auth/v1/ {
        proxy_pass http://auth:8767/auth/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 60s;
    }

    location / {
        return 404 '{"message":"not found"}';
        add_header Content-Type application/json;
    }
}
